<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3c52">
  <title>Rotina do dia · Órion</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b3c52'/><ellipse cx='16' cy='19' rx='8' ry='7' fill='none' stroke='%2322b8d4' stroke-width='3.5' transform='rotate(-25 16 19)'/><path d='M12 8 L21 4.5' stroke='%2322b8d4' stroke-width='2.5' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="style.css?v=202610281600">
</head>
<body data-page="cs-rotina">
  <main class="content et-page">
    <header class="page-head">
      <div><h1>Rotina do dia</h1><p>Segunda a sexta, das 13h às 19h. Marque cada bloco quando terminar: o progresso aparece no painel de Desempenho.</p></div>
    </header>

    <div class="card et-nav">
      <button class="btn small ghost" id="ant" aria-label="Dia anterior">‹</button>
      <input type="date" class="input" id="dia">
      <button class="btn small ghost" id="prox" aria-label="Próximo dia">›</button>
      <button class="btn small ghost" id="hoje">Hoje</button>
      <span class="spacer"></span>
      <span class="muted small" id="quem"></span>
    </div>

    <section class="dash-section">
      <div class="kpis main" id="k-rotina"></div>
      <div class="et-semana" id="semana"></div>
    </section>

    <section class="dash-section">
      <div class="section-head"><span class="badge lime">Blocos</span><h2 id="titulo-dia">Blocos do dia</h2></div>
      <div class="et-blocos" id="blocos"></div>
      <ul class="et-regras" id="regras"></ul>
      <label class="field wide et-obs"><span>Observações do dia</span><textarea class="input" id="obs" rows="3" placeholder="Pendências, combinados, o que ficou para amanhã…"></textarea></label>
    </section>
  </main>
  <script src="config.js?v=202610281600"></script>
  <script src="store.js?v=202610281600"></script>
  <script src="common.js?v=202610281600"></script>
  <script src="dash.js?v=202610281600"></script>
  <script src="estagio.js?v=202610281600"></script>
  <script src="cs-rotina.js?v=202610281600"></script>
</body>
</html>
