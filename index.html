<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3c52">
  <title>Início · Órion</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b3c52'/><ellipse cx='16' cy='19' rx='8' ry='7' fill='none' stroke='%2322b8d4' stroke-width='3.5' transform='rotate(-25 16 19)'/><path d='M12 8 L21 4.5' stroke='%2322b8d4' stroke-width='2.5' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="style.css?v=202610091200">
</head>
<body data-page="inicio">
  <main class="content">
    <header class="page-head">
      <div><h1>Olá!</h1><p>Resumo rápido da operação</p></div>
    </header>
    <section class="home-grid" id="home"></section>
  </main>
  <script src="config.js?v=202610091200"></script>
  <script src="store.js?v=202610091200"></script>
  <script src="common.js?v=202610091200"></script>
  <script src="monitor.js?v=202610091200"></script>
  <script>
    (async () => {
      if (window.SEM_ACESSO) return;
      const ler = t => Store.podeLer(t) ? Store.list(t) : Promise.resolve([]);
      let comercial = [], cs = [], crm = [], leads = [], status = [], beats = [], cfg;
      try {
        [comercial, cs, crm, leads, status, beats, cfg] = await Promise.all([
          ler('comercial'), ler('cs'), ler('crm'), ler('leads'),
          // Status dos Sistemas é só para administradores
          Store.isAdmin() ? Store.list('status') : [], Store.isAdmin() ? Store.list('heartbeat') : [], Store.isAdmin() ? Monitor.loadConfig() : Monitor.DEFAULT]);
      } catch (e) { toast('Erro ao carregar dados: ' + e.message, 'error'); cfg = Monitor.DEFAULT; }

      const today = dates.today(), mes = today.slice(0, 7);
      const saiu = new Set(cs.filter(c => c.data_saida_prevista && c.data_saida_prevista <= today).map(c => norm(c.loja)));
      const ativos = comercial.filter(c => !saiu.has(norm(c.nome_loja)));
      const novosMes = comercial.filter(c => (c.mes_fechamento || dates.ym(c.data_entrada_real)) === mes).length;
      const prox30 = cs.filter(c => c.data_saida_prevista >= today && c.data_saida_prevista <= dates.addDays(today, 30)).length;
      const pendAP = cs.filter(c => (c.reuniao_ap || 'Pendente') === 'Pendente' && (!c.data_saida_prevista || c.data_saida_prevista >= today)).length;

      const byId = arr => Object.fromEntries(arr.map(x => [x.id, x]));
      const M = byId(status), B = byId(beats);
      const res = Store.isAdmin() ? await Promise.all(cfg.servicos.map(s => Monitor.check(s, M[s.id], B[s.id]))) : [];
      const down = cfg.servicos.filter((s, i) => res[i].status === 'down');

      const abertas = crm.filter(d => d.etapa !== 'Perdido' && d.etapa !== 'Negócio fechado');
      const semContato = crm.filter(d => (d.etapa || 'Sem contato') === 'Sem contato').length;
      const leadsNovos = leads.filter(l => (l.status || 'Novo') === 'Novo').length;
      const cards = [
        { href: 'sprints.html', title: 'Sprints', value: 'Sprint da semana', sub: 'KRs, tarefas, retrospectiva e coleta de dados' },
        { area: 'Comercial', href: 'crm.html', title: 'CRM', value: abertas.length + ' negociações abertas', sub: `${semContato} aguardando primeiro contato` },
        { area: 'Comercial', href: 'comercial.html', title: 'Comercial', value: fmt.num(ativos.length, 0) + ' clientes ativos', sub: `${novosMes} fechamentos neste mês` },
        { area: 'CS', href: 'cs.html', title: 'CS', value: prox30 + ' saídas em 30 dias', sub: `${pendAP} reuniões de A.P pendentes` },
        { area: 'Comercial', href: 'dashboard-comercial.html', title: 'Dashboard Comercial', value: fmt.moneyShort(somaMensalidades(ativos)), sub: 'em mensalidades fixas ativas/mês' },
        { area: 'CS', href: 'dashboard-cs.html', title: 'Dashboard CS', value: cs.length + ' solicitações', sub: 'de saída registradas no total' },
        { area: 'MKT', href: 'leads.html', title: 'Leads do formulário', value: leads.length + ' leads', sub: `${leadsNovos} aguardando contato` },
        { area: 'admin', href: 'sistemas.html', title: 'Status dos Sistemas',
          value: down.length ? `<span class="badge down">✕ ${down.length} com problema</span>` : '<span class="badge ok">● Tudo operando</span>',
          sub: down.length ? down.map(s => esc(s.nome)).join(', ') : `${cfg.servicos.length} serviços monitorados` },
      ];
      function somaMensalidades(arr) { return arr.reduce((s, r) => s + (Number(r.mensalidade_fixa) || 0), 0); }
      $('#home').innerHTML = cards.filter(c => Store.veArea(c.area)).map(c => `
        <a class="card home-card" href="${c.href}"><strong>${c.title}</strong>
        <span class="value">${c.value}</span><span class="muted small">${c.sub}</span></a>`).join('');
    })();
  </script>
</body>
</html>
