# Publica o site oriondelivery.com.br (pasta site/) na Cloudflare a cada Push que mexe no site.
# Precisa do segredo CLOUDFLARE_API_TOKEN no repositório (Settings > Secrets and variables > Actions).
name: Publicar site oriondelivery.com.br

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/publicar-site.yml']
  workflow_dispatch:

concurrency:
  group: publicar-site
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar na Cloudflare
        working-directory: site
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8e7b3e33fbf47bbfe9fa3a4594871222
