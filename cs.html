<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3c52">
  <title>CS · Órion</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b3c52'/><ellipse cx='16' cy='19' rx='8' ry='7' fill='none' stroke='%2322b8d4' stroke-width='3.5' transform='rotate(-25 16 19)'/><path d='M12 8 L21 4.5' stroke='%2322b8d4' stroke-width='2.5' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="style.css?v=202610101700">
</head>
<body data-page="cs">
  <main class="content">
    <header class="page-head">
      <div><h1>CS</h1><p>Solicitações de saída, aviso prévio e tempo de vida dos clientes</p></div>
    </header>
    <div id="crud"></div>
  </main>
  <script src="config.js?v=202610101700"></script>
  <script src="store.js?v=202610101700"></script>
  <script src="common.js?v=202610101700"></script>
  <script src="schemas.js?v=202610101700"></script>
  <script src="crud.js?v=202610101700"></script>
  <script>
    (async () => {
      let comercial = [];
      try { comercial = await Store.list('comercial'); } catch (e) { toast(e.message, 'error'); }
      const byLoja = Object.fromEntries(comercial.map(c => [norm(c.nome_loja), c]));

      CrudPage({
        el: '#crud', table: 'cs', fields: CS_FIELDS, filterKey: 'hub', sortKey: 'data_saida_prevista',
        suggestions: { loja: comercial.map(c => c.nome_loja).filter(Boolean) },
        // Ao informar a loja, completa os campos vazios com os dados do Comercial
        onChange(key, rec) {
          if (key !== 'loja' && key !== null) return {};
          const c = byLoja[norm(rec.loja)];
          if (!c) return {};
          const src = {
            nome_cliente: c.nome_cliente, hub: c.hub, mensalidade_fixa: c.mensalidade_fixa,
            modelo: c.modelo, taxa_variavel: c.taxa_variavel_pct, espaco: c.espaco_ocupado,
            taxa_variavel_rs: isDK(c.modelo) ? c.taxa_variavel_rs : null,
            data_entrada_contrato: c.data_entrada_contrato, data_entrada_real: c.data_entrada_real,
            data_inicio: c.data_entrada_real || c.data_entrada_contrato,
          };
          return Object.fromEntries(Object.entries(src).filter(([k, v]) => !isBlank(v) && isBlank(rec[k])));
        },
      });
    })();
  </script>
</body>
</html>
