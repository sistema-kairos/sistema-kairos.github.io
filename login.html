<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3c52">
  <title>Entrar · Órion</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b3c52'/><ellipse cx='16' cy='19' rx='8' ry='7' fill='none' stroke='%2322b8d4' stroke-width='3.5' transform='rotate(-25 16 19)'/><path d='M12 8 L21 4.5' stroke='%2322b8d4' stroke-width='2.5' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="style.css?v=202610100900">
</head>
<body data-page="login">
  <div class="login-wrap">
    <span class="login-logo logo-mark logo-horizontal" role="img" aria-label="Órion Dark Stores"></span>
    <form class="card login-card" id="login">
      <h2>Entrar no Gestão Hubs</h2>
      <label class="field"><span>E-mail</span><input class="input" type="email" name="email" required autocomplete="username"></label>
      <label class="field"><span>Senha</span><input class="input" type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn primary" type="submit">Entrar</button>
      <p class="muted small" id="mode"></p>
    </form>
  </div>
  <script src="config.js?v=202610100900"></script>
  <script src="store.js?v=202610100900"></script>
  <script src="common.js?v=202610100900"></script>
  <script>
    if (!Store.isRemote()) {
      $('#mode').innerHTML = 'Nenhum banco na nuvem configurado. <a href="index.html">Continuar em modo local</a>.';
    } else if (Store.getSession()) {
      location.href = 'index.html';
    }
    // configuração salva na página Configurações tem prioridade sobre o config.js
    if (localStorage.getItem('gh_settings')) {
      $('#mode').innerHTML = `Este navegador está usando uma configuração salva manualmente
        (<code>${esc(Store.settings().supabaseUrl)}</code>), e não a do config.js.
        <a href="#" id="reset-settings">Usar a do config.js</a>`;
      $('#reset-settings').addEventListener('click', e => {
        e.preventDefault();
        Store.setSettings(null);
        Store.logout();
        location.reload();
      });
    }
    $('#login').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target, btn = $('button', f);
      btn.disabled = true;
      try {
        await Store.login(f.email.value.trim(), f.password.value);
        await Store.carregarPerfil().catch(() => null);
        location.href = 'index.html';
      } catch (err) { toast(err.message, 'error'); }
      finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
