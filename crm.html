<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3c52">
  <title>CRM · Órion</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b3c52'/><ellipse cx='16' cy='19' rx='8' ry='7' fill='none' stroke='%2322b8d4' stroke-width='3.5' transform='rotate(-25 16 19)'/><path d='M12 8 L21 4.5' stroke='%2322b8d4' stroke-width='2.5' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="style.css?v=202611111530">
</head>
<body data-page="crm">
  <main class="content crm-page">
    <header class="page-head">
      <div><h1>CRM</h1><p>Negociações do comercial, do primeiro contato ao fechamento</p></div>
      <div class="spacer"></div>
      <div class="crm-acoes">
        <details class="menu-mais">
          <summary class="btn ghost">Mais <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
          <div class="menu-pop" role="menu">
            <button type="button" id="importar" role="menuitem">Importar planilha</button>
            <button type="button" id="exportar" role="menuitem">Exportar negociações</button>
            <button type="button" id="dono-leads" role="menuitem" title="Para quem vão as negociações que chegam pelo formulário"></button>
          </div>
        </details>
        <button class="btn primary" id="nova">+ Nova negociação</button>
      </div>
    </header>

    <div class="crm-barra">
      <div class="modo-crm" role="group" aria-label="Forma de ver as negociações">
        <button class="on" data-modo="quadro" aria-pressed="true">Quadro</button>
        <button data-modo="lista" aria-pressed="false">Lista</button>
      </div>
      <label class="busca-crm"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="busca" placeholder="Buscar negociação, contato, telefone…" aria-label="Buscar"></label>
      <button class="btn ghost btn-filtros" id="btn-filtros"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filtros <span class="cont hidden" id="n-filtros"></span></button>
      <label class="check"><input type="checkbox" id="f-perdidos" checked> Mostrar perdidos</label>
    </div>
    <div class="filtros-ativos hidden" id="filtros-ativos"></div>
    <div class="crm-resumo">
      <span class="muted small" id="resumo"></span>
      <div class="qualif" id="qualif" aria-label="Negociações em aberto por qualificação"></div>
    </div>
    <div class="board" id="board"></div>
    <div class="lista-crm hidden" id="lista">
      <div class="massa hidden" id="massa" role="region" aria-label="Ações em massa">
        <b id="massa-n"></b>
        <button class="btn small" data-acao="responsavel">Transferir responsável</button>
        <button class="btn small" data-acao="etapa">Mudar etapa</button>
        <button class="btn small" data-acao="qualificacao">Alterar qualificação</button>
        <button class="btn small" data-acao="tarefa">Criar tarefa</button>
        <button class="btn small" data-acao="fonte">Alterar fonte</button>
        <button class="btn small" data-acao="exportar">Exportar</button>
        <button class="btn small danger" data-acao="excluir">Excluir</button>
        <button class="link-btn" data-acao="limpar">Limpar seleção</button>
      </div>
      <div class="card table-card"><div class="table-wrap" id="tabela"></div></div>
    </div>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Detalhes da negociação"></aside>
  <div class="drawer-backdrop" id="backdrop"></div>

  <script src="config.js?v=202611111530"></script>
  <script src="store.js?v=202611111530"></script>
  <script src="common.js?v=202611111530"></script>
  <script src="crud.js?v=202611111530"></script>
  <script src="crm.js?v=202611111530"></script>
</body>
</html>
